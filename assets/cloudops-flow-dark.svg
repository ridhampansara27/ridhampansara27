ite" calcMode="discrete" keyTimes="0;0.2944;0.3778;0.9611" values="#26384f;#ffb547;#4fd18b;#26384f"/></rect><text class="sans" x="453" y="138" font-size="13.5" font-weight="600" fill="#e8eef7">GHCR</text><text class="sans" x="453" y="156" font-size="11.5" fill="#8a9bb4">multi-arch image</text><circle cx="546" cy="127" r="4" fill="#4f617c"><animate attributeName="fill" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2944;0.3778;0.9611" values="#4f617c;#ffb547;#4fd18b;#4f617c"/></circle><rect x="577.33" y="114" width="118" height="54" rx="10" fill="#132036" stroke="#26384f" stroke-width="1.6"><animate attributeName="stroke" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3778;0.4611;0.9611" values="#26384f;#ffb547;#4fd18b;#26384f"/></rect><text class="sans" x="589.33" y="138" font-size="13.5" font-weight="600" fill="#e8eef7">promote</text><text class="sans" x="589.33" y="156" font-size="11.5" fill="#8a9bb4">GitOps repo</text><circle cx="682.33" cy="127" r="4" fill="#4f617c"><animate attributeName="fill" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3778;0.4611;0.9611" values="#4f617c;#ffb547;#4fd18b;#4f617c"/></circle><rect x="713.67" y="114" width="118" height="54" rx="10" fill="#132036" stroke="#26384f" stroke-width="1.6"><animate attributeName="stroke" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.4611;0.5444;0.9611" values="#26384f;#ffb547;#4fd18b;#26384f"/></rect><text class="sans" x="725.67" y="138" font-size="13.5" font-weight="600" fill="#e8eef7">Argo CD</text><text class="sans" x="725.67" y="156" font-size="11.5" fill="#8a9bb4">sync</text><circle cx="818.67" cy="127" r="4" fill="#4f617c"><animate attributeName="fill" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.4611;0.5444;0.9611" values="#4f617c;#ffb547;#4fd18b;#4f617c"/></circle><rect x="850" y="114" width="118" height="54" rx="10" fill="#132036" stroke="#26384f" stroke-width="1.6"><animate attributeName="stroke" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5444;0.6278;0.9611" values="#26384f;#ffb547;#4fd18b;#26384f"/></rect><text class="sans" x="862" y="138" font-size="13.5" font-weight="600" fill="#e8eef7">OKE</text><text class="sans" x="862" y="156" font-size="11.5" fill="#8a9bb4">production</text><circle cx="955" cy="127" r="4" fill="#4f617c"><animate attributeName="fill" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5444;0.6278;0.9611" values="#4f617c;#ffb547;#4fd18b;#4f617c"/></circle><rect x="32" y="182" width="936" height="3" rx="1.5" fill="#26384f"/><rect x="32" y="182" width="0" height="3" rx="1.5" fill="#4fd18b"><animate attributeName="width" dur="9s" repeatCount="indefinite" keyTimes="0;0.0444;0.6278;0.9611;1" values="0;0;936;936;0"/></rect><text class="sans" x="32" y="208" font-size="12.5" fill="#8a9bb4">Images are immutable and built for several architectures; the cluster runs only what Git declares. Terraform owns the OCI network, OKE and storage.</text><path d="M32 234 H968" stroke="#26384f"/><text class="sans" x="32" y="264" font-size="14.5" font-weight="700" fill="#e8eef7">Runtime<tspan dx="10" font-weight="400" font-size="13" fill="#8a9bb4">read-only, isolated per tenant</tspan></text><path class="flow" d="M32 307.0 H968" stroke="#5cc8ff" stroke-width="2.4" stroke-dasharray="6 14" stroke-linecap="round"/><rect x="32" y="280" width="140" height="54" rx="10" fill="#132036" stroke="#26384f" stroke-width="1.6"/><text class="sans" x="44" y="304" font-size="13.5" font-weight="600" fill="#e8eef7">AWS account</text><text class="sans" x="44" y="322" font-size="11.5" fill="#8a9bb4">tenant</text><rect x="191.2" y="280" width="140" height="54" rx="10" fill="#132036" stroke="#26384f" stroke-width="1.6"/><text class="sans" x="203.2" y="304" font-size="13.5" font-weight="600" fill="#e8eef7">STS AssumeRole</text><text class="sans" x="203.2" y="322" font-size="11.5" fill="#8a9bb4">+ External ID</text><rect x="350.4" y="280" width="140" height="54" rx="10" fill="#132036" stroke="#26384f" stroke-width="1.6"/><text class="sans" x="362.4" y="304" font-size="13.5" font-weight="600" fill="#e8eef7">Celery workers</text><text class="sans" x="362.4" y="322" font-size="11.5" fill="#8a9bb4">sync jobs</text><rect x="509.6" y="280" width="140" height="54" rx="10" fill="#132036" stroke="#26384f" stroke-width="1.6"/><text class="sans" x="521.6" y="304" font-size="13.5" font-weight="600" fill="#e8eef7">PostgreSQL</text><text class="sans" x="521.6" y="322" font-size="11.5" fill="#8a9bb4">+ Redis</text><rect x="668.8" y="280" width="140" height="54" rx="10" fill="#132036" stroke="#26384f" stroke-width="1.6"/><text class="sans" x="680.8" y="304" font-size="13.5" font-weight="600" fill="#e8eef7">FastAPI</text><text class="sans" x="680.8" y="322" font-size="11.5" fill="#8a9bb4">tenant RBAC</text><rect x="828" y="280" width="140" height="54" rx="10" fill="#132036" stroke="#26384f" stroke-width="1.6"/><text class="sans" x="840" y="304" font-size="13.5" font-weight="600" fill="#e8eef7">React UI</text><text class="sans" x="840" y="322" font-size="11.5" fill="#8a9bb4">cost, health views</text><text class="sans" x="32" y="360" font-size="12.5" fill="#8a9bb4">Syncs inventory, CloudWatch health and Cost Explorer data through short-lived STS credentials; no customer keys are stored.</text></svg>
