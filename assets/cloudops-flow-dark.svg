<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="384" viewBox="0 0 1000 384" role="img" aria-labelledby="t d">
<title id="t">CloudOps Insight delivery and runtime flow</title>
<desc id="d">Delivery lane: each stage from git push to production turns amber while running and green when it passes. Runtime lane: data flows from tenant AWS accounts through STS and Celery into PostgreSQL, FastAPI and the React UI.</desc>
