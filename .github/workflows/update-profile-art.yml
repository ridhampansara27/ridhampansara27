name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/contributions.json"
      - "assets/github-activity.svg"

permissions:
  contents: write

concurrency:
  group: update-profile-art
  cancel-in-progress: true

jobs:
  contribution-heatmap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install profile-art dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch public contribution data
        run: python scripts/fetch_contributions.py

      - name: Render animated contribution heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Commit refreshed profile art
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json assets/github-activity.svg
          if git diff --cached --quiet; then
            echo "No profile-art changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh contribution graph [skip ci]"
          git push
